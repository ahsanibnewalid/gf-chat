<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">GF Chat feature overview</title><desc id="d">An infographic describing calculator utility, authenticated private rooms, messaging, consent-based location sharing, and admin configuration.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#0b1020"/><stop offset="1" stop-color="#202d54"/></linearGradient></defs><rect width="1200" height="760" rx="30" fill="url(#b)"/><text x="60" y="82" fill="#fff" font-family="Arial,sans-serif" font-size="42" font-weight="700">GF Chat · Feature Guide</text><text x="62" y="122" fill="#b8c5e6" font-family="Arial,sans-serif" font-size="20">A lightweight web app with clear consent and account-based access.</text><g font-family="Arial,sans-serif"><g transform="translate(60 170)"><rect width="520" height="220" rx="22" fill="#151d30" stroke="#526488"/><circle cx="58" cy="58" r="30" fill="#4148a7"/><text x="58" y="68" font-size="28" fill="#fff" text-anchor="middle">1</text><text x="105" y="55" font-size="25" font-weight="700" fill="#fff">Calculator utility</text><text x="32" y="112" font-size="18" fill="#c7d3ee">• Responsive number pad and display</text><text x="32" y="146" font-size="18" fill="#c7d3ee">• Safe arithmetic parser</text><text x="32" y="180" font-size="18" fill="#c7d3ee">• Works without signing in</text></g><g transform="translate(620 170)"><rect width="520" height="220" rx="22" fill="#151d30" stroke="#526488"/><circle cx="58" cy="58" r="30" fill="#4148a7"/><text x="58" y="68" font-size="28" fill="#fff" text-anchor="middle">2</text><text x="105" y="55" font-size="25" font-weight="700" fill="#fff">Private chat rooms</text><text x="32" y="112" font-size="18" fill="#c7d3ee">• Email/password and configured providers</text><text x="32" y="146" font-size="18" fill="#c7d3ee">• Verified accounts and room membership</text><text x="32" y="180" font-size="18" fill="#c7d3ee">• Realtime messages with timestamps</text></g><g transform="translate(60 420)"><rect width="520" height="220" rx="22" fill="#151d30" stroke="#526488"/><circle cx="58" cy="58" r="30" fill="#16664f"/><text x="58" y="68" font-size="28" fill="#fff" text-anchor="middle">3</text><text x="105" y="55" font-size="25" font-weight="700" fill="#fff">Consent-based location</text><text x="32" y="112" font-size="18" fill="#c7d3ee">• User starts sharing with a button</text><text x="32" y="146" font-size="18" fill="#c7d3ee">• Map link for a received location</text><text x="32" y="180" font-size="18" fill="#c7d3ee">• Stop sharing deletes your own record</text></g><g transform="translate(620 420)"><rect width="520" height="220" rx="22" fill="#151d30" stroke="#526488"/><circle cx="58" cy="58" r="30" fill="#7c83ff"/><text x="58" y="68" font-size="28" fill="#10152b" text-anchor="middle">4</text><text x="105" y="55" font-size="25" font-weight="700" fill="#fff">Admin configuration</text><text x="32" y="112" font-size="18" fill="#c7d3ee">• Separate GitHub Pages dashboard</text><text x="32" y="146" font-size="18" fill="#c7d3ee">• Render API with UID-based admin checks</text><text x="32" y="180" font-size="18" fill="#c7d3ee">• Encrypted provider secrets at rest</text></g></g><text x="60" y="710" fill="#aab7ce" font-family="Arial,sans-serif" font-size="16">Always review Firebase Database Rules and provider setup before production use.</text></svg>